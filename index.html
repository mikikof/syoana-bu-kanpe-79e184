<!DOCTYPE html>

<title>証券アナリスト2次 BU答練 講義カンペ</title>
<style>
  :root{ --navy:#1E4D6B; --navy-dark:#163A52; --lb:#B8D4E8; --bg:#F5F6F8; --paper:#fff; --text:#1F1F1F; --muted:#555; --border:#DCDCDC; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
  .wrap{max-width:760px;margin:0 auto;padding:48px 20px 64px}
  header{border-bottom:3px solid var(--navy);padding-bottom:18px;margin-bottom:28px}
  h1{font-size:1.55rem;color:var(--navy);margin:0 0 6px}
  .sub{color:var(--muted);font-size:.95rem;margin:0}
  .cards{display:grid;gap:16px;margin-top:8px}
  a.card{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--border);border-left:6px solid var(--navy);border-radius:10px;padding:20px 22px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  a.card:hover{border-left-color:var(--navy-dark);box-shadow:0 4px 14px rgba(30,77,107,.14);transform:translateY(-1px)}
  .card .no{display:inline-block;background:var(--lb);color:var(--navy-dark);font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:20px;margin-bottom:8px}
  .card h2{font-size:1.15rem;color:var(--navy);margin:0 0 6px}
  .card p{margin:0;color:var(--muted);font-size:.9rem}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--border);color:#888;font-size:.8rem}
  .note{background:#FFF8E8;border:1px solid #E0A45C;border-radius:8px;padding:10px 14px;font-size:.82rem;color:#7a5a2a;margin-top:18px}
</style>
</head>
<body>
